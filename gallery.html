<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,sans-serif;
color:#fff;
min-height:100vh;

background:
radial-gradient(circle at 10% 10%,#635bff 0,transparent 28%),
radial-gradient(circle at 90% 85%,#ff3cac 0,transparent 28%),
linear-gradient(135deg,#080914,#12152a,#080914);

transition:.4s;
}


/* =========================
   ANIMATED BACKGROUND
========================= */

.bg{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:-1;
}

.blob{
position:absolute;
border-radius:50%;
filter:blur(70px);
opacity:.22;
animation:float 8s ease-in-out infinite alternate;
}

.blob1{
width:280px;
height:280px;
background:#735cff;
left:-100px;
top:10%;
}

.blob2{
width:300px;
height:300px;
background:#ff3cac;
right:-120px;
bottom:5%;
}

.blob3{
width:180px;
height:180px;
background:#00d4ff;
left:45%;
top:40%;
}

@keyframes float{
to{
transform:translate(45px,40px) scale(1.18);
}
}


/* =========================
   MENU BUTTON
========================= */

.menu-btn{
position:fixed;
left:15px;
top:15px;

width:48px;
height:48px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:5px;

border-radius:15px;

background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.2);

backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);

cursor:pointer;
z-index:10002;

transition:.3s;
}

.menu-btn:hover{
transform:scale(1.06);

box-shadow:
0 0 15px rgba(115,92,255,.6),
0 0 30px rgba(255,60,172,.3);
}

.menu-btn span{
width:23px;
height:2px;
background:#fff;
border-radius:10px;
transition:.3s;
}


/* =========================
   THEME BUTTON
========================= */

.theme-btn{
position:fixed;
right:15px;
top:15px;

width:48px;
height:48px;

border-radius:15px;

background:rgba(255,255,255,.1);

border:1px solid rgba(255,255,255,.2);

color:#fff;

font-size:20px;

cursor:pointer;

z-index:10002;

backdrop-filter:blur(15px);

transition:.3s;
}

.theme-btn:hover{
transform:scale(1.06);

box-shadow:
0 0 15px rgba(115,92,255,.6),
0 0 30px rgba(255,60,172,.3);
}


/* =========================
   SIDE MENU
========================= */

.side-menu{
position:fixed;

left:0;
top:0;

width:50%;
height:100vh;

padding:90px 20px 30px;

background:
radial-gradient(
circle at 20% 20%,
rgba(99,91,255,.35),
transparent 35%
),
radial-gradient(
circle at 80% 80%,
rgba(255,60,172,.25),
transparent 35%
),
rgba(8,9,20,.97);

border-right:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

box-shadow:
10px 0 40px rgba(0,0,0,.35),
0 0 30px rgba(115,92,255,.25);

transform:translateX(-100%);

opacity:0;

visibility:hidden;

transition:
transform .4s ease,
opacity .3s ease,
visibility .4s ease;

overflow-y:auto;

z-index:10001;
}

.side-menu.show{
transform:translateX(0);
opacity:1;
visibility:visible;
}

.side-menu a{
display:block;
text-decoration:none;
color:#fff;

padding:15px 14px;

border-radius:14px;

margin-bottom:8px;

font-size:15px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

transition:.3s;
}

.side-menu a:hover{
background:
linear-gradient(
135deg,
#735cff,
#ff3cac
);

transform:translateX(5px);

box-shadow:
0 0 18px rgba(115,92,255,.4),
0 0 25px rgba(255,60,172,.25);
}


/* =========================
   CONTAINER
========================= */

.container{
width:92%;
max-width:900px;
margin:auto;
padding:90px 0 40px;
}


/* =========================
   HEADER
========================= */

.header{
text-align:center;
animation:appear .8s ease;
}

.header h1{
font-size:34px;
margin-top:10px;

background:
linear-gradient(
90deg,
#fff,
#b9afff,
#ff8bd4
);

-webkit-background-clip:text;
color:transparent;
}

.header p{
margin-top:8px;
opacity:.65;
}

.gallery-label{
margin-top:14px;
font-size:15px;
color:#cfc8ff;
opacity:.75;
}


/* =========================
   TABS
========================= */

.tabs{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:25px;
}

.tabs button{
border:1px solid rgba(255,255,255,.15);

padding:12px 20px;

border-radius:25px;

font-size:15px;

color:#fff;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

cursor:pointer;

transition:.3s;
}

.tabs button:hover{
transform:translateY(-3px);

box-shadow:
0 0 18px rgba(115,92,255,.3);
}

.tabs button.active{
background:
linear-gradient(
135deg,
#735cff,
#ff3cac
);

box-shadow:
0 0 20px rgba(115,92,255,.45),
0 0 30px rgba(255,60,172,.15);
}


/* =========================
   SECTION
========================= */

.section{
display:none;
padding:25px 0 20px;
animation:fade .45s ease;
}

.section.active{
display:block;
}

.section h2{
text-align:center;
margin-bottom:18px;

background:
linear-gradient(
90deg,
#fff,
#c5bcff,
#ff9ddd
);

-webkit-background-clip:text;
color:transparent;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:translateY(0);
}

}


/* =========================
   REFRESH
========================= */

.refresh{
border:1px solid rgba(255,255,255,.15);

background:rgba(255,255,255,.08);

color:#fff;

padding:10px 18px;

border-radius:25px;

cursor:pointer;

margin:0 auto 18px;

display:block;

transition:.3s;

backdrop-filter:blur(10px);
}

.refresh:hover{
transform:scale(1.05);

box-shadow:
0 0 18px rgba(115,92,255,.35);
}


/* =========================
   LOADING
========================= */

.loading{
padding:30px 10px;
text-align:center;
color:#ccc;
font-size:15px;
}

.spinner{
width:40px;
height:40px;

border:4px solid rgba(255,255,255,.15);

border-top:4px solid #735cff;

border-right:4px solid #ff3cac;

border-radius:50%;

margin:0 auto 15px;

animation:spin .8s linear infinite;
}

@keyframes spin{

to{
transform:rotate(360deg);
}

}


/* =========================
   EMPTY
========================= */

.empty{
padding:30px 15px;

color:#bbb;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.1);

border-radius:20px;

max-width:550px;

margin:auto;

backdrop-filter:blur(15px);
}


/* =========================
   PHOTO
========================= */

.gallery{
display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

max-width:750px;

margin:auto;
}

.photo-item{
position:relative;

overflow:hidden;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.12);

box-shadow:
0 10px 30px rgba(0,0,0,.25);

transition:.3s;

padding-bottom:58px;
}

.photo-item:hover{
transform:translateY(-4px);

box-shadow:
0 0 25px rgba(115,92,255,.25);
}

.photo-item img{
width:100%;

height:190px;

object-fit:cover;

display:block;

cursor:pointer;

transition:.4s;
}

.photo-item:hover img{
transform:scale(1.07);
}

.photo-name{
position:absolute;

bottom:58px;

left:0;
right:0;

padding:10px;

background:
linear-gradient(
transparent,
rgba(0,0,0,.85)
);

font-size:12px;

text-align:left;

overflow:hidden;

white-space:nowrap;

text-overflow:ellipsis;
}


/* =========================
   PREMIUM DOWNLOAD
========================= */

.download-box{
position:absolute;

left:10px;
right:10px;

bottom:10px;

z-index:5;
}

.download-btn{
position:relative;

width:100%;

height:44px;

border:none;

border-radius:14px;

color:#fff;

font-size:14px;

font-weight:bold;

letter-spacing:.3px;

cursor:pointer;

overflow:hidden;

background:
linear-gradient(
135deg,
#735cff,
#ff3cac
);

box-shadow:
0 5px 18px rgba(115,92,255,.35);

transition:.3s;
}

.download-btn:hover{
transform:translateY(-2px);

box-shadow:
0 0 18px rgba(115,92,255,.65),
0 0 30px rgba(255,60,172,.3);
}

.download-btn:active{
transform:scale(.97);
}

.download-btn:disabled{
opacity:1;
}

.download-content{
position:relative;
z-index:3;

display:flex;

align-items:center;

justify-content:center;

gap:8px;

height:100%;
}

.download-icon{
font-size:18px;
}

.download-progress{
position:absolute;

left:0;
top:0;
bottom:0;

width:0%;

background:
linear-gradient(
90deg,
rgba(0,255,200,.38),
rgba(255,255,255,.22)
);

transition:width .12s linear;

z-index:1;
}

.download-shine{
position:absolute;

top:0;
left:-100%;

width:70%;

height:100%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.25),
transparent
);

transform:skewX(-20deg);

animation:shine 2.2s infinite;

z-index:2;
}

@keyframes shine{

0%{
left:-100%;
}

45%,100%{
left:140%;
}

}

.download-btn.downloading{
cursor:wait;

box-shadow:
0 0 20px rgba(115,92,255,.55);
}

.download-btn.success{
background:
linear-gradient(
135deg,
#00b894,
#00cec9
);

box-shadow:
0 0 22px rgba(0,206,201,.5);
}

.download-btn.error{
background:
linear-gradient(
135deg,
#ff4757,
#ff6b81
);
}


/* =========================
   MUSIC
========================= */

max-width:650px;
margin:auto;
}

.music-card{
margin:15px auto;

padding:20px;

border-radius:20px;

background:rgba(255,255,255,.07);

border:1px solid rgba(255,255,255,.12);

backdrop-filter:blur(20px);

box-shadow:
0 15px 40px rgba(0,0,0,.2);

transition:.3s;
}

.music-card:hover{
transform:translateY(-4px);

box-shadow:
0 0 25px rgba(115,92,255,.25);
}

.music-icon{
font-size:45px;
text-align:center;

animation:musicGlow 2s ease-in-out infinite alternate;
}

@keyframes musicGlow{

to{
filter:
drop-shadow(
0 0 12px #ff3cac
);
}

}

margin:10px 0;
text-align:center;

}

.music-card audio{
width:100%;
margin-top:10px;
}

.music-card .download-box{
position:relative;

left:auto;
right:auto;
bottom:auto;

margin-top:15px;
}


/* =========================
   VIDEO
========================= */

max-width:750px;
margin:auto;
}

.video-card{
margin:15px auto;

padding:15px;

border-radius:20px;

background:rgba(255,255,255,.07);

border:1px solid rgba(255,255,255,.12);

box-shadow:
0 15px 40px rgba(0,0,0,.2);

transition:.3s;
}

.video-card:hover{
transform:translateY(-4px);

box-shadow:
0 0 25px rgba(255,60,172,.2);
}

.video-card h3{

width:100%;

max-height:500px;

left:auto;
right:auto;

}


/* =========================

.back{
display:block;

width:max-content;

margin:25px auto;

padding:12px 25px;

border-radius:30px;

text-decoration:none;

linear-gradient(
135deg,
#735cff,
#ff3cac

box-shadow:
0 0 18px rgba(115,92,255,.3);

.back:hover{

0 0 25px rgba(115,92,255,.7);

/* =========================

========================= */

.footer{
text-align:center;
padding:25px 10px;
opacity:.5;

}


/* =========================
   IMAGE VIEWER
========================= */

.viewer{
display:none;

position:fixed;

z-index:9999;

inset:0;

background:rgba(0,0,0,.94);

align-items:center;

justify-content:center;

padding:20px;
}

.viewer.show{
display:flex;
}

.viewer img{
max-width:95%;

max-height:85vh;

object-fit:contain;

border-radius:15px;

box-shadow:
0 0 35px rgba(115,92,255,.5);
}

.close{
position:absolute;

top:15px;

right:20px;

font-size:40px;

cursor:pointer;

color:#fff;

z-index:10000;

transition:.3s;
}

.close:hover{
color:#ff8bd4;

transform:scale(1.1);
}


/* =========================
   APPEAR
========================= */

@keyframes appear{

from{
opacity:0;
transform:translateY(25px);
}

to{
opacity:1;
transform:translateY(0);
}

}


/* =========================
   LIGHT MODE
========================= */

body.light{
color:#222;

background:
radial-gradient(
circle at 10% 10%,
#b9b1ff 0,

10px 0 40px rgba(0,0,0,.12),

}

body.light .side-menu a{
color:#222;

border-color:rgba(0,0,0,.07);

body.light .theme-btn{

body.light .menu-btn span{

}

body.light .header h1,
body.light .section h2{

linear-gradient(
90deg,
#222,
#635bff,
#ff3cac

}

body.light .gallery-label{

}

body.light .loading{

body.light .empty{

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

.container{
width:94%;
padding-top:85px;
}

font-size:28px;
}

grid-template-columns:
repeat(2,1fr);

gap:9px;
}

height:150px;
}

.tabs button{
padding:10px 16px;

}

@media(max-width:350px){

}

}

}

</style>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://oppmdnnzgqdnwpqqkwsq.supabase.co";

const SUPABASE_KEY =
"sb_publishable__PhPsPq-M7xfHLbPwOaUzA_vEDzn22B";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   SAFE TEXT
========================= */

function setText(id,value){

const element =
document.getElementById(id);

if(
element &&
value !== undefined &&
value !== null &&
String(value).trim() !== ""
){

element.textContent =
String(value);

}

}


/* =========================
   WHATSAPP LINK
========================= */

function makeWhatsAppLink(value){

if(!value){

return "";

}

const text =
String(value).trim();


if(
text.startsWith("http://") ||
text.startsWith("https://")
){

return text;

}


const number =
text
.replace(/^\+/,"")
.replace(/[^\d]/g,"");


if(!number){

return "";

}


return "https://wa.me/" + number;

}


/* =========================
   SOCIAL LINK
========================= */

function normalizeSocial(
value,
type
){

if(!value){

return "";

}

const text =
String(value).trim();


if(
text.startsWith("http://") ||
text.startsWith("https://")
){

return text;

}


if(type === "facebook"){

return "https://www.facebook.com/" + text;

}


if(type === "linkedin"){

return "https://www.linkedin.com/in/" + text;

}


if(type === "whatsapp"){

return makeWhatsAppLink(text);

}


return text;

}


/* =========================
   MENU
========================= */

function toggleMenu(){

const menu =
document.getElementById(
"sideMenu"
);

menu.classList.toggle(
"show"
);

}


/* =========================
   OUTSIDE CLICK
========================= */

document.addEventListener(
"click",
function(event){

const menu =
document.getElementById(
"sideMenu"
);

const button =
document.getElementById(
"menuBtn"
);

/* =========================
   FILE NAME
========================= */

function cleanFileName(name){

if(!name){

return "";

}

return name
.replace(/\.[^/.]+$/,"")
.replace(/[_-]+/g," ")
.trim();

}


/* =========================
   ANDROID DOWNLOAD
========================= */

function downloadFile(
url,
fileName,
button
){

if(
button.dataset.downloading ===
"true"
){

return;

}

button.dataset.downloading =
"true";

button.disabled =
true;

button.classList.remove(
"success",
"error"
);

button.classList.add(
"downloading"
);

const progress =
button.querySelector(
".download-progress"
);

const content =
button.querySelector(
".download-content"
);

const shine =
button.querySelector(
".download-shine"
);

progress.style.width =
"0%";

content.innerHTML = `
<span class="download-icon">
⏬
</span>

<span>
Starting download...
</span>
`;

let downloadUrl =
url;

try{

const separator =
url.includes("?")
? "&"
: "?";

downloadUrl =
url +
separator +
"download=" +
encodeURIComponent(
fileName
);

}catch(error){

downloadUrl =
url;

}

const link =
document.createElement(
"a"
);

link.href =
downloadUrl;

link.download =
fileName;

link.target =
"_blank";

link.rel =
"noopener";

link.style.display =
"none";

document.body.appendChild(
link
);

try{

link.click();

}catch(error){

console.error(
"Download trigger error:",
error
);

button.classList.remove(
"downloading"
);

button.classList.add(
"error"
);

content.innerHTML = `
<span class="download-icon">
❌
</span>

<span>
Download Failed
</span>
`;

setTimeout(
function(){

resetDownloadButton(
button
);

},
2500
);

return;

}

setTimeout(
function(){

link.remove();

},
1000
);

setTimeout(
function(){

progress.style.width =
"100%";

content.innerHTML = `
<span class="download-icon">
⬇️
</span>

<span>
Download Started
</span>
`;

button.classList.remove(
"downloading"
);

button.classList.add(
"success"
);

if(shine){

shine.style.display =
"none";

}

setTimeout(
function(){

button.disabled =
false;

button.dataset.downloading =
"false";

button.classList.remove(
"success"
);

progress.style.width =
"0%";

if(shine){

shine.style.display =
"block";

}

content.innerHTML = `
<span class="download-icon">
⬇️
</span>

<span>
Download
</span>
`;

},
3000
);

},
800
);

}


/* =========================
   RESET BUTTON
========================= */

function resetDownloadButton(
button
){

const content =
button.querySelector(
".download-content"
);

const progress =
button.querySelector(
".download-progress"
);

const shine =
button.querySelector(
".download-shine"
);

button.disabled =
false;

button.dataset.downloading =
"false";

button.classList.remove(
"downloading",
"success",
"error"
);

progress.style.width =
"0%";

if(shine){

shine.style.display =
"block";

}

content.innerHTML = `
<span class="download-icon">
⬇️
</span>

<span>
Download
</span>
`;

}


/* =========================
   DOWNLOAD BUTTON
========================= */

function createDownloadButton(
url,
fileName
){

const box =
document.createElement(
"div"
);

box.className =
"download-box";

const button =
document.createElement(
"button"
);

button.className =
"download-btn";

button.type =
"button";

button.dataset.downloading =
"false";

button.innerHTML = `
<div class="download-progress"></div>

<div class="download-shine"></div>

<div class="download-content">

<span class="download-icon">
⬇️
</span>

<span>
Download
</span>

</div>
`;

button.addEventListener(
"click",
function(event){

event.preventDefault();

event.stopPropagation();

downloadFile(
url,
fileName,
button
);

});

box.appendChild(
button
);

return box;

}

async function loadPhotos(){

const loading =
document.getElementById(
"photoLoading"
);

const gallery =
document.getElementById(
"photoGallery"
);

loading.style.display =
"block";

gallery.innerHTML =
"";

const {data,error} =
await supabaseClient
.storage
.from("media")
.list(
"photos",
{
limit:100,

sortBy:{
column:"name",
order:"desc"
}

}
);

loading.style.display =
"none";

if(error){

gallery.innerHTML = `

<div class="empty">

❌ Photos load করা যাচ্ছে না।

<br><br>

${error.message}

</div>

`;

return;

}

const files =
(data || [])
.filter(
function(file){

return (
file.name &&
file.id !== null
);

}
);

if(files.length === 0){

gallery.innerHTML = `

<div
class="empty"
style="grid-column:1/-1;">

📭 এখনো কোনো Photo upload করা হয়নি।

</div>

`;

return;

}

files.forEach(
function(file){

const path =
"photos/" +
file.name;

const result =
supabaseClient
.storage
.from("media")
.getPublicUrl(
path
);

const imageUrl =
result.data.publicUrl;

const item =
document.createElement(
"div"
);

item.className =
"photo-item";

const image =
document.createElement(
"img"
);

image.src =
imageUrl;

image.alt =
file.name;

image.loading =
"lazy";

image.onclick =
function(){

openViewer(
imageUrl
);

};

item.appendChild(
image
);

const name =
document.createElement(
"div"
);

name.className =
"photo-name";

name.textContent =
cleanFileName(
file.name
);

item.appendChild(
name
);

const downloadButton =
createDownloadButton(
imageUrl,
file.name
);

item.appendChild(
downloadButton
);

gallery.appendChild(
item
);

});

}
